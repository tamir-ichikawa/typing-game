<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Typing Game</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main class="game-container">
    <h1>Typing Game</h1>

    <!-- モード選択画面 -->
    <section id="mode-screen" class="screen">
      <h2>モード選択</h2>
      <p class="screen-description">遊びたいモードを選んでください。</p>

      <div class="button-list">
        <button class="menu-button" data-mode="normal">
          通常モード
          <span>固定の難易度で練習</span>
        </button>

        <button class="menu-button" data-mode="challenge">
          チャレンジモード
          <span>10秒ごとに難易度が変化</span>
        </button>

        <button class="menu-button" data-mode="food">
          早食いモード
          <span>食べ物・料理名だけで勝負</span>
        </button>
      </div>
    </section>

    <!-- 難易度選択画面 -->
    <section id="difficulty-screen" class="screen hidden">
      <h2 id="mode-title">難易度選択</h2>
      <p id="mode-description" class="screen-description"></p>

      <div id="difficulty-buttons" class="button-list"></div>

      <button id="back-button" class="secondary-button">Back</button>
    </section>

    <!-- ゲーム画面 -->
    <section id="game-screen" class="screen hidden">
      <div id="selected-mode-label" class="mode-label">MODE</div>

      <div class="status-area">
        <div>TIME: <span id="time">60</span></div>
        <div>SCORE: <span id="score">0</span></div>
      </div>

      <div id="challenge-status" class="challenge-status hidden">
        LEVEL: <span id="level-name">EASY</span> /
        10秒内 正解: <span id="level-score">0</span> / 5 /
        残り: <span id="level-time">10</span>
      </div>

      <div class="word-area">
        <p id="word">START</p>
      </div>

      <input
        id="input"
        type="text"
        placeholder="ここに入力"
        autocomplete="off"
        disabled
      />

      <div class="game-buttons">
        <button id="start-button">START</button>
        <button id="mode-select-button" class="secondary-button">MODE SELECT</button>
      </div>

      <p id="message"></p>
    </section>
  </main>

  <script src="./texts.js?v=2"></script>
  <script src="./main.js?v=3"></script>
</body>
</html>
