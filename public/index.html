<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>タイピングエンジン</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div id="loading-screen" class="loading-screen">
    <div class="loading-logo-area">
      <img
        class="loading-logo"
        src="./assets/images/logo/enzine-logo.png"
        alt="enzine room 千葉 ロゴ"
      />

      <!--
      <p class="loading-brand-name">enzine room 千葉</p>
      -->
    </div>

    <h2 class="loading-title">読み込み中...</h2>

    <div class="loading-bar">
      <div id="loading-bar-fill" class="loading-bar-fill"></div>
    </div>

    <p id="loading-percent">0%</p>
    <p id="loading-detail">ゲームを読み込み中...</p>
  </div>

  <main id="app" class="game-container hidden">
    <h1>タイピングエンジン</h1>
    <div id="menu-character" class="menu-character">
      <img
        id="menu-character-img"
        src="./assets/images/character/menu-character.png"
        alt="menu character"
      />
    </div>

    <!-- 名前登録画面 -->
    <section id="name-screen" class="screen">
      <h2>プレイヤー登録</h2>
      <p class="screen-description">名前を登録してね！</p>

      <input
        id="name-input"
        type="text"
        placeholder="名前を入力"
        maxlength="12"
        autocomplete="off"
      />

      <button id="name-submit-button">登録して進む</button>

      <p id="firebase-status" class="small-message">Firebase接続準備中...</p>
    </section>

    <!-- モード選択画面 -->
    <section id="mode-screen" class="screen hidden">
      <h2>モード選択</h2>
      <p class="screen-description">遊びたいモードを選んでね！</p>

      <div class="button-list">
        <button class="menu-button" data-mode="normal">
          通常モード
          <span>固定の難易度で練習</span>
        </button>

        <button class="menu-button" data-mode="challenge">
          チャレンジモード
          <span>10秒ごとに難易度が変化</span>
        </button>

        <button class="menu-button" data-mode="food">
          早食いモード
          <span>食べ物・料理名だけで勝負</span>
        </button>
      </div>

      <div class="sub-menu-buttons">
        <button id="all-ranking-button" class="secondary-button">
          全ランキングを見る
        </button>

        <button id="mode-sound-toggle-button" class="secondary-button">
          SOUND ON
        </button>
      </div>
    </section>

    <!-- 全ランキング画面 -->
    <section id="all-ranking-screen" class="screen hidden">
      <h2>全ランキング</h2>
      <p class="screen-description">モード・難易度ごとのランキングを表示します。</p>

      <div id="all-ranking-list" class="all-ranking-list">
        <p>読み込み中...</p>
      </div>

      <button id="all-ranking-back-button" class="secondary-button">Back</button>
    </section>


    <!-- 難易度選択画面 -->
    <section id="difficulty-screen" class="screen hidden">
      <h2 id="mode-title">難易度選択</h2>
      <p id="mode-description" class="screen-description"></p>

      <div id="difficulty-buttons" class="button-list"></div>

      <button id="back-button" class="secondary-button">Back</button>
    </section>

    <!-- ゲーム画面 -->
    <section id="game-screen" class="screen hidden">
      <div id="countdown-overlay" class="countdown-overlay hidden">
        <div id="countdown-text" class="countdown-text">3</div>
      </div>

      <div id="game-character" class="game-character">
        <div id="game-character-sprite" class="game-character-sprite character-idle"></div>
      </div>

      <div id="player-label" class="mode-label">PLAYER</div>
      <div id="selected-mode-label" class="mode-label">MODE</div>

      <div class="status-area">
        <div>TIME: <span id="time">60</span></div>
        <div>SCORE: <span id="score">0</span></div>
      </div>

      <div id="challenge-status" class="challenge-status hidden">
        LEVEL: <span id="level-name">EASY</span> /
        10秒内 正解: <span id="level-score">0</span> / 5 /
        残り: <span id="level-time">10</span>
      </div>

      <div class="word-area">
        <p id="word">START</p>
      </div>

      <input
        id="input"
        type="text"
        placeholder="ここに入力"
        autocomplete="off"
        disabled
      />

      <div class="game-buttons">
        <button id="start-button">START</button>
        <button id="sound-toggle-button" class="secondary-button">SOUND ON</button>
        <button id="mode-select-button" class="secondary-button">MODE SELECT</button>
      </div>

      <p id="message"></p>

      <div id="ranking-area" class="ranking-area">
        <h2 id="ranking-title">ランキング</h2>
        <ol id="ranking-list"></ol>
      </div>
    </section>
  </main>

  <div id="sprite-preload-area" class="sprite-preload-area">
    <div class="game-character-sprite character-idle"></div>
    <div class="game-character-sprite character-correct"></div>
    <div class="game-character-sprite character-finish"></div>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <script src="./firebase-config.js?v=1"></script>
  <script src="./texts.js?v=3"></script>
  <script src="./main.js?v=5"></script>
</body>
</html>
